<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MV Luxe | Smart Living, Beautifully Simple</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #faf9f6;
    color: #171717;
    line-height: 1.6;
}

/* HEADER */

header {
    background: #111;
    color: white;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.nav {
    max-width: 1200px;
    margin: auto;
    padding: 15px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 26px;
    font-weight: bold;
    letter-spacing: 2px;
}

.logo span {
    color: #d4af37;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 15px;
    font-size: 14px;
}

.cart-button {
    background: #d4af37;
    color: #111;
    border: none;
    padding: 10px 14px;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
}

#cart-count {
    background: #111;
    color: white;
    border-radius: 50%;
    padding: 2px 7px;
    margin-left: 5px;
}

/* HERO */

.hero {
    min-height: 520px;
    display: flex;
    align-items: center;
    background:
    linear-gradient(rgba(0,0,0,.65), rgba(0,0,0,.65)),
    url("https://images.unsplash.com/photo-1556228720-195a672e8a03?auto=format&fit=crop&w=1600&q=80")
    center/cover;
    color: white;
}

.hero-content {
    max-width: 1200px;
    width: 100%;
    margin: auto;
    padding: 60px 20px;
}

.hero h1 {
    font-size: clamp(42px, 8vw, 72px);
    line-height: 1.05;
    max-width: 700px;
    margin-bottom: 20px;
}

.hero h1 span {
    color: #d4af37;
}

.hero p {
    max-width: 550px;
    font-size: 18px;
    margin-bottom: 30px;
}

.btn {
    display: inline-block;
    background: #d4af37;
    color: #111;
    border: none;
    padding: 14px 22px;
    border-radius: 5px;
    font-weight: bold;
    text-decoration: none;
    cursor: pointer;
}

/* SECTIONS */

.section {
    max-width: 1200px;
    margin: auto;
    padding: 70px 20px;
}

.section-title {
    text-align: center;
    margin-bottom: 40px;
}

.section-title h2 {
    font-size: 36px;
}

/* PRODUCTS */

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 25px;
}

.product {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
}

.product img {
    width: 100%;
    height: 280px;
    object-fit: cover;
}

.product-info {
    padding: 20px;
}

.product-info h3 {
    margin-bottom: 10px;
}

.price {
    font-size: 24px;
    font-weight: bold;
    margin: 15px 0;
}

    top: 0;
    right: -100%;
